[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subocr"
dynamic = ["version"]
description = "Fill subtitle gaps next to media: extract embedded text subtitles, OCR bitmap subtitles to SRT."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pysubs2>=1.7", "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
subocr = "subocr.cli:main"

[tool.setuptools.dynamic]
version = { attr = "subocr.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
